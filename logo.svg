      <path transform="translate(451.5 58) scale(1.55)" d="M0 0H60V14H37V80H23V14H0Z" fill-rule="evenodd"/>
      <path transform="translate(569.3 58) scale(1.55)" d="M0 0H48L60 12V38L48 50H14V80H0Z M14 14V36H42L46 32V18L42 14Z" fill-rule="evenodd"/>
      <path transform="translate(687.1 58) scale(1.55)" d="M10 0H60V14H14V33H50L60 43V70L50 80H0V66H46V47H10L0 37V10Z" fill-rule="evenodd"/>
    </g>
    <g fill="#ff2bd6" opacity="0.75" transform="translate(5 -2)">
      <path transform="translate(215.9 58) scale(1.55)" d="M10 0H60V14H14V33H50L60 43V70L50 80H0V66H46V47H10L0 37V10Z" fill-rule="evenodd"/>
      <path transform="translate(333.7 58) scale(1.55)" d="M0 0H44L60 16V64L44 80H0Z M14 14V66H38L46 58V22L38 14Z" fill-rule="evenodd"/>
      <path transform="translate(451.5 58) scale(1.55)" d="M0 0H60V14H37V80H23V14H0Z" fill-rule="evenodd"/>
      <path transform="translate(569.3 58) scale(1.55)" d="M0 0H48L60 12V38L48 50H14V80H0Z M14 14V36H42L46 32V18L42 14Z" fill-rule="evenodd"/>
      <path transform="translate(687.1 58) scale(1.55)" d="M10 0H60V14H14V33H50L60 43V70L50 80H0V66H46V47H10L0 37V10Z" fill-rule="evenodd"/>
    </g>
    <g fill="url(#neon)" filter="url(#glow)">
      <path transform="translate(215.9 58) scale(1.55)" d="M10 0H60V14H14V33H50L60 43V70L50 80H0V66H46V47H10L0 37V10Z" fill-rule="evenodd"/>
      <path transform="translate(333.7 58) scale(1.55)" d="M0 0H44L60 16V64L44 80H0Z M14 14V66H38L46 58V22L38 14Z" fill-rule="evenodd"/>
      <path transform="translate(451.5 58) scale(1.55)" d="M0 0H60V14H37V80H23V14H0Z" fill-rule="evenodd"/>
      <path transform="translate(569.3 58) scale(1.55)" d="M0 0H48L60 12V38L48 50H14V80H0Z M14 14V36H42L46 32V18L42 14Z" fill-rule="evenodd"/>
      <path transform="translate(687.1 58) scale(1.55)" d="M10 0H60V14H14V33H50L60 43V70L50 80H0V66H46V47H10L0 37V10Z" fill-rule="evenodd"/>
    </g>
    <g fill="#f4f1ff" clip-path="url(#band1)" transform="translate(14 0)">
      <path transform="translate(215.9 58) scale(1.55)" d="M10 0H60V14H14V33H50L60 43V70L50 80H0V66H46V47H10L0 37V10Z" fill-rule="evenodd"/>
      <path transform="translate(333.7 58) scale(1.55)" d="M0 0H44L60 16V64L44 80H0Z M14 14V66H38L46 58V22L38 14Z" fill-rule="evenodd"/>
      <path transform="translate(451.5 58) scale(1.55)" d="M0 0H60V14H37V80H23V14H0Z" fill-rule="evenodd"/>
      <path transform="translate(569.3 58) scale(1.55)" d="M0 0H48L60 12V38L48 50H14V80H0Z M14 14V36H42L46 32V18L42 14Z" fill-rule="evenodd"/>
      <path transform="translate(687.1 58) scale(1.55)" d="M10 0H60V14H14V33H50L60 43V70L50 80H0V66H46V47H10L0 37V10Z" fill-rule="evenodd"/>
    </g>
    <g fill="#18e7ff" clip-path="url(#band2)" transform="translate(-18 0)">
      <path transform="translate(215.9 58) scale(1.55)" d="M10 0H60V14H14V33H50L60 43V70L50 80H0V66H46V47H10L0 37V10Z" fill-rule="evenodd"/>
      <path transform="translate(333.7 58) scale(1.55)" d="M0 0H44L60 16V64L44 80H0Z M14 14V66H38L46 58V22L38 14Z" fill-rule="evenodd"/>
      <path transform="translate(451.5 58) scale(1.55)" d="M0 0H60V14H37V80H23V14H0Z" fill-rule="evenodd"/>
      <path transform="translate(569.3 58) scale(1.55)" d="M0 0H48L60 12V38L48 50H14V80H0Z M14 14V36H42L46 32V18L42 14Z" fill-rule="evenodd"/>
      <path transform="translate(687.1 58) scale(1.55)" d="M10 0H60V14H14V33H50L60 43V70L50 80H0V66H46V47H10L0 37V10Z" fill-rule="evenodd"/>
    </g>

  <text x="480.0" y="278" text-anchor="middle" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="15" fill="#f4f1ff" letter-spacing="5" opacity="0.92">SEQUENTIAL DOCUMENT TRANSFER PROTOCOL SECURE</text>
  <rect width="960" height="300" fill="url(#scan)"/>
</svg>
