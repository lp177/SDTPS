<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">SDTPS</title>
  <desc id="d">SDTPS: Sequential Document Transfer Protocol Secure. Neon letters with a glitch on a dark perspective grid.</desc>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="0.55" stop-color="#b14bff"/>
      <stop offset="1" stop-color="#18e7ff"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07030f"/>
      <stop offset="0.62" stop-color="#1a0630"/>
      <stop offset="1" stop-color="#05020a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.35"/>
    </pattern>
    <pattern id="hazard" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="11" height="22" fill="#ffe14d"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="band1"><rect x="0" y="88" width="960" height="9"/></clipPath>
    <clipPath id="band2"><rect x="0" y="150" width="960" height="6"/></clipPath>
  </defs>

  <rect width="960" height="300" fill="url(#sky)"/>
  <circle cx="480.0" cy="196" r="120" fill="#ff2bd6" opacity="0.10"/>
  <g stroke="url(#fade)" stroke-width="1.4" fill="none">
      <line x1="480.0" y1="196" x2="-600.0" y2="300"/>
      <line x1="480.0" y1="196" x2="-480.0" y2="300"/>
      <line x1="480.0" y1="196" x2="-360.0" y2="300"/>
      <line x1="480.0" y1="196" x2="-240.0" y2="300"/>
      <line x1="480.0" y1="196" x2="-120.0" y2="300"/>
      <line x1="480.0" y1="196" x2="0.0" y2="300"/>
      <line x1="480.0" y1="196" x2="120.0" y2="300"/>
      <line x1="480.0" y1="196" x2="240.0" y2="300"/>
      <line x1="480.0" y1="196" x2="360.0" y2="300"/>
      <line x1="480.0" y1="196" x2="480.0" y2="300"/>
      <line x1="480.0" y1="196" x2="600.0" y2="300"/>
      <line x1="480.0" y1="196" x2="720.0" y2="300"/>
      <line x1="480.0" y1="196" x2="840.0" y2="300"/>
      <line x1="480.0" y1="196" x2="960.0" y2="300"/>
      <line x1="480.0" y1="196" x2="1080.0" y2="300"/>
      <line x1="480.0" y1="196" x2="1200.0" y2="300"/>
      <line x1="480.0" y1="196" x2="1320.0" y2="300"/>
      <line x1="480.0" y1="196" x2="1440.0" y2="300"/>
      <line x1="480.0" y1="196" x2="1560.0" y2="300"/>
      <line x1="0" y1="206" x2="960" y2="206" opacity="0.35"/>
      <line x1="0" y1="220" x2="960" y2="220" opacity="0.47"/>
      <line x1="0" y1="240" x2="960" y2="240" opacity="0.59"/>
      <line x1="0" y1="266" x2="960" y2="266" opacity="0.71"/>
      <line x1="0" y1="300" x2="960" y2="300" opacity="0.83"/>
  </g>
  <rect x="0" y="194" width="960" height="3" fill="#ff2bd6" opacity="0.8" filter="url(#glow)"/>

  <!-- frame: brackets and hazard tape -->
  <g fill="none" stroke="#18e7ff" stroke-width="3" opacity="0.9">
    <path d="M24 70V24H70"/><path d="M890 24H936V70"/>
    <path d="M24 204V250H70" stroke="#ff2bd6"/><path d="M890 250H936V204" stroke="#ff2bd6"/>
  </g>
  <rect x="710" y="14" width="160" height="10" fill="url(#hazard)" opacity="0.85"/>
  <text x="870" y="46" text-anchor="end" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffe14d" letter-spacing="2">v1 // SECURE</text>
  <text x="34" y="48" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#18e7ff" opacity="0.8" letter-spacing="3">/// MAILBOX // SEQUENCE // TAKE-ONCE</text>

    <g transform="translate(141.9 92)" filter="url(#glow)">
      <path d="M10 34V22a14 14 0 0 1 28 0v12" fill="none" stroke="url(#neon)" stroke-width="7"/>
      <path d="M2 34H46V74L38 82H2Z" fill="url(#neon)"/>
      <path d="M21 50h6v14h-6z" fill="#0a0612"/>
    </g>
    <!-- glitch: offset ghosts in cyan and magenta, then the neon letters -->
    <g fill="#18e7ff" opacity="0.75" transform="translate(-5 2)">
      <path transform="translate(215.9 58) scale(1.55)" d="M10 0H60V14H14V33H50L60 43V70L50 80H0V66H46V47H10L0 37V10Z" fill-rule="evenodd"/>
