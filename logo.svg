<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">SDTPS — The unbroken knot</title>
<desc id="desc">A gold ribbon padlock whose arms are tunnels opening on a ring road. Sliding wards close the left tunnels and stand drawn back in the right ones: closed on the left, open on the right.</desc>
